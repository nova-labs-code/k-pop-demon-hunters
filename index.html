<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Pop Demon Hunters</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    audio {
      width: 80%;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div>
    <audio id="player" controls></audio>
    <div>
      <button id="prevBtn">Prev</button>
      <button id="nextBtn">Next</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="repeatBtn">Repeat</button>
    </div>
  </div>

  <script>
    const playlist = [
      "Soda Pop (HUNTR/X Version)",
      "How It's Done (KPOP DEMON HUNTERS METAL COVER)",
      "Golden (Acapella)",
      "Golden (Instrumental)",
      "Golden (Sing-Along)",
      "Golden",
      "How It's Done (Acapella)",
      "How It's Done (Instrumental)",
      "How It's Done (Sing-Along)",
      "How It's Done",
      "Takedown (Acapella)",
      "Takedown (Instrumental)",
      "Takedown (Sing-Along)",
      "Takedown",
      "What It Sounds Like (Acapella)",
      "What It Sounds Like (Instrumental)",
      "What It Sounds Like (Sing-Along)",
      "What It Sounds Like",
      "Soda Pop (Cover)",
      "Jinu's Lament",
      "오솔길 Path",
      "Soda Pop (Feat Kim X & ZEVON) (Acoustic Version)",
      "Male Version HUNTRIX - Golden (Kpop Demon Hunters)",
      "Your Idol - KPop Demon Hunters - Acoustic Cover",
      "Prolouge (Hunter's Mantra)",
      "Score Suite",
      "Face Your Demons (Rumi Villain Song)",
      "Your Idol (Huntrix Version)",
      "Golden Cover (Rain Paris)",
      "Free (Acapella)",
      "Free (Instrumental)",
      "Free (Sing-Along)",
      "Free",
      "Soda Pop (Acapella)",
      "Soda Pop (Instrumental)",
      "Soda Pop (Sing-Along)",
      "Soda Pop",
      "Your Idol (Acapella)",
      "Your Idol (Instrumental)",
      "Your Idol (Sing-Along)",
      "Your Idol",
      "Huntrix - Takedown (Singing Cover)",
      "KPop Demon Hunters - TAKEDOWN (Slowed Acoustic Lyrics)",
      "What it sounds like (acoustic)",
      "Strategy",
      "TAKEDOWN",
      "Monst3r - Rumi (K-Pop Demon Hunters)",
      "Takedown - Saja Boys (Demon Boy Cut)",
      "사랑인가 봐 Love, Maybe",
      "Golden (Acoustic Cover)"
    ];

    const player = document.getElementById("player");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");

    let currentTrack = 0;
    let isShuffle = false;
    let isRepeat = false;

    function loadTrack(index) {
      currentTrack = index;
      player.src = `https://dev-bvp.github.io/k-pop-demon-hunters/song${index+1}-50.mp3`;
      player.play();

      // Update Media Session metadata
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: playlist[index],
          artist: "K-Pop Demon Hunters",
          album: "KPDH OST",
          artwork: [
            { src: "https://bvp.neocities.org/roblox%20pfp.png", sizes: "512x512", type: "image/png" }
          ]
        });

        navigator.mediaSession.setActionHandler("previoustrack", () => {
          playPrev();
        });

        navigator.mediaSession.setActionHandler("nexttrack", () => {
          playNext();
        });
      }

      // Update tab title
      document.title = "KPDH - " + playlist[index];
    }

    function playNext() {
      if (isShuffle) {
        loadTrack(Math.floor(Math.random() * playlist.length));
      } else if (currentTrack < playlist.length - 1) {
        loadTrack(currentTrack + 1);
      } else if (isRepeat) {
        loadTrack(0);
      }
    }

    function playPrev() {
      if (isShuffle) {
        loadTrack(Math.floor(Math.random() * playlist.length));
      } else if (currentTrack > 0) {
        loadTrack(currentTrack - 1);
      } else if (isRepeat) {
        loadTrack(playlist.length - 1);
      }
    }

    player.addEventListener("ended", () => {
      playNext();
    });

    prevBtn.addEventListener("click", playPrev);
    nextBtn.addEventListener("click", playNext);
    shuffleBtn.addEventListener("click", () => isShuffle = !isShuffle);
    repeatBtn.addEventListener("click", () => isRepeat = !isRepeat);

    // Auto load first track
    loadTrack(0);
  </script>
</body>
</html>
