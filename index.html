<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8K Audio Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 24px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start</button>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const logoRadius = 150; // circle in the middle

    const audio = new Audio("song1.mp3"); // change to your audio file
    audio.crossOrigin = "anonymous";
    audio.loop = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    const analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyser.fftSize = 16384; // max safe FFT
    const bufferLength = analyser.frequencyBinCount; 
    const dataArray = new Uint8Array(bufferLength);

    const bars = 8000; // bars count
    const angleStep = (Math.PI * 2) / bars;

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw circle logo
      ctx.beginPath();
      ctx.arc(centerX, centerY, logoRadius, 0, Math.PI * 2);
      ctx.strokeStyle = "white";
      ctx.lineWidth = 5;
      ctx.stroke();

      for (let i = 0; i < bars; i++) {
        const value = dataArray[i % bufferLength];
        const barHeight = value * 0.5;

        const angle = i * angleStep;
        const x1 = centerX + Math.cos(angle) * logoRadius;
        const y1 = centerY + Math.sin(angle) * logoRadius;
        const x2 = centerX + Math.cos(angle) * (logoRadius + barHeight);
        const y2 = centerY + Math.sin(angle) * (logoRadius + barHeight);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `hsl(${i / bars * 360}, 100%, 50%)`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      audioCtx.resume().then(() => {
        audio.play();
        document.getElementById("startBtn").style.display = "none";
        document.body.style.cursor = "none"; // hide mouse
        draw();
      });
    });
  </script>
</body>
</html>
