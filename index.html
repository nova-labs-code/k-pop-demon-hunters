<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Demon Hunters</title>
<link rel="manifest" href="./manifest.json">

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}

canvas {
  display:block;
}

#startText {
  position: fixed;
  inset: 0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
  background: rgba(0,0,0,0.85);
  z-index:9999;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="startText">Click to Start</div>

<audio id="player" preload="auto" playsinline></audio>
<canvas id="canvas"></canvas>

<script>
// Canvas
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Playlist
let tracks = [];
for (let i = 1; i <= 50; i++) {
  tracks.push(`./song${i}.mp3`);
}

// Names
const trackNames = {
  "song1.mp3":"Soda Pop (HUNTR/X Version)",
  "song2.mp3":"How It's Done (KPOP DEMON HUNTERS METAL COVER)",
  "song3.mp3":"Golden (Acapella)",
  "song4.mp3":"Golden (Instrumental)",
  "song5.mp3":"Golden (Sing-Along)",
  "song6.mp3":"Golden",
  "song7.mp3":"How It's Done (Acapella)",
  "song8.mp3":"How It's Done (Instrumental)",
  "song9.mp3":"How It's Done (Sing-Along)",
  "song10.mp3":"How It's Done",
  "song11.mp3":"Takedown (Acapella)",
  "song12.3":"Takedown (Instrumental)",
  "song13.mp3":"Takedown (Sing-Along)",
  "song14.mp3":"Takedown",
  "song15.mp3":"What It Sounds Like (Acapella)",
  "song16.mp3":"What It Sounds Like (Instrumental)",
  "song17.mp3":"What It Sounds Like (Sing-Along)",
  "song18.mp3":"What It Sounds Like",
  "song19.mp3":"Soda Pop (Cover)",
  "song20.mp3":"Jinu's Lament",
  "song21.mp3":"오솔길 Path",
  "song22.mp3":"Soda Pop (Acoustic)",
  "song23.mp3":"Golden Male Version",
  "song24.mp3":"Your Idol Acoustic",
  "song25.mp3":"Hunter's Mantra",
  "song26.mp3":"Score Suite",
  "song27.mp3":"Face Your Demons",
  "song28.mp3":"Your Idol",
  "song29.mp3":"Golden Cover",
  "song30.mp3":"Free (Acapella)",
  "song31.mp3":"Free (Instrumental)",
  "song32.mp3":"Free (Sing-Along)",
  "song33.mp3":"Free",
  "song34.mp3":"Soda Pop Acapella",
  "song35.mp3":"Soda Pop Instrumental",
  "song36.mp3":"Soda Pop Sing-Along",
  "song37.mp3":"Soda Pop",
  "song38.mp3":"Your Idol Acapella",
  "song39.mp3":"Your Idol Instrumental",
  "song40.mp3":"Your Idol Sing-Along",
  "song41.mp3":"Your Idol",
  "song42.mp3":"Takedown Cover",
  "song43.mp3":"TAKEDOWN Slowed",
  "song44.mp3":"What it sounds like acoustic",
  "song45.mp3":"Strategy",
  "song46.mp3":"TAKEDOWN",
  "song47.mp3":"Monst3r",
  "song48.mp3":"Takedown Saja Boys",
  "song49.mp3":"Love, Maybe",
  "song50.mp3":"Golden Acoustic"
};

// Shuffle
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
shuffle(tracks);

let currentTrack = 0;
const audio = document.getElementById('player');

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 8192;

const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
const smoothArray = new Float32Array(bufferLength);

// Title update
function updateTabTitle(url){
  const name = trackNames[url.split('/').pop()] || "Unknown";
  document.title = `KPDH - ${name}`;
}

// Media Session (lock screen support)
function updateMediaSession(url){
  const name = trackNames[url.split('/').pop()] || "Unknown";

  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name,
      artist: 'KPDH',
      album: 'Playlist',
      artwork: [{ src:'./favicon.ico', sizes:'512x512', type:'image/ico' }]
    });

    navigator.mediaSession.setActionHandler('nexttrack', ()=>playTrack(currentTrack+1));
    navigator.mediaSession.setActionHandler('previoustrack', ()=>playTrack(currentTrack-1));
    navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
    navigator.mediaSession.setActionHandler('play', ()=>audio.play());
  }
}

// Play
function playTrack(index){
  if(index<0) index = tracks.length-1;
  if(index>=tracks.length) index = 0;

  currentTrack = index;
  audio.src = tracks[currentTrack];

  updateTabTitle(tracks[currentTrack]);
  updateMediaSession(tracks[currentTrack]);

  audio.play().catch(()=>{});
}

audio.addEventListener("ended", ()=>playTrack(currentTrack+1));

// START
const startText = document.getElementById('startText');

startText.addEventListener("click", async ()=>{
  await audioCtx.resume();
  startText.style.display = "none";
  document.body.style.cursor = "none";
  playTrack(currentTrack);
});

// KEY CONTROLS
window.addEventListener('keydown', e=>{
  if(e.code==="MediaTrackNext") playTrack(currentTrack+1);
  if(e.code==="MediaTrackPrevious") playTrack(currentTrack-1);
  if(e.code==="Space") audio.paused ? audio.play() : audio.pause();
});

// 🔥 IMPORTANT: suspend visuals when hidden
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    audioCtx.suspend();
  } else {
    audioCtx.resume();
  }
});

// VISUALIZER
const logo = new Image();
logo.src = "./favicon.ico";

const actualBars = 4000;
const maxFreq = 600;

function draw(){
  requestAnimationFrame(draw);

  // if hidden, skip heavy work
  if(document.hidden) return;

  const cx = canvas.width/2;
  const cy = canvas.height/2;
  const base = Math.min(canvas.width,canvas.height)*0.12;

  analyser.getByteFrequencyData(dataArray);

  for(let i=0;i<bufferLength;i++){
    smoothArray[i] = smoothArray[i]*0.75 + dataArray[i]*0.25;
  }

  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let bass = 0;
  for(let i=0;i<60;i++) bass += smoothArray[i];
  bass /= 60;

  const radius = base + (bass/255)*base*0.6;

  const timeShift = Date.now()*0.02;

  for(let i=0;i<actualBars;i++){
    const angle = (i/actualBars)*Math.PI*2;
    const idx = Math.floor((i/actualBars)*maxFreq);

    const spike = (smoothArray[idx]/255)*120 + bass*0.2;

    const x1 = cx + Math.cos(angle)*radius;
    const y1 = cy + Math.sin(angle)*radius;
    const x2 = cx + Math.cos(angle)*(radius+spike);
    const y2 = cy + Math.sin(angle)*(radius+spike);

    ctx.strokeStyle = `hsl(${(i*360/actualBars + timeShift)%360},100%,55%)`;
    ctx.lineWidth = 0.4;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  if(logo.complete){
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.clip();
    ctx.drawImage(logo,cx-radius,cy-radius,radius*2,radius*2);
    ctx.restore();
  }
}

draw();
</script>
</body>
</html>
