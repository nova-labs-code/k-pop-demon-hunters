<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Beat Visualizer</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}
canvas { display:block; }
#startText {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
}
</style>
</head>
<body>

<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const startText = document.getElementById("startText");

const audio = document.getElementById("player");
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048; // higher resolution
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// --- Tracks sequentially from song1 to song50 ---
const maxTracks = 50;
let tracks = [];
for(let i=1;i<=maxTracks;i++){
    tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
}
let currentTrack = 0;

function playNextTrack(){
    if(tracks.length===0) return;
    if(currentTrack >= tracks.length) currentTrack = 0;
    audio.src = tracks[currentTrack];
    audio.play().catch(err => console.log("Play error:", err));
    currentTrack++;
}

// --- Click to start ---
startText.addEventListener("click", ()=>{
    audioCtx.resume().then(()=>{
        startText.style.display = "none";
        document.body.style.cursor = "none"; // hide cursor
        playNextTrack();
    });
});

audio.addEventListener("ended", playNextTrack);

// --- Draw loop ---
function draw(){
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    // Fade for trail effect
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const barWidth = canvas.width / bufferLength * 2;
    let x = 0;

    // Calculate volume levels for bass/mid/treble
    const bass = dataArray.slice(0,20).reduce((a,b)=>a+b,0)/20;
    const mid = dataArray.slice(20,100).reduce((a,b)=>a+b,0)/80;
    const treble = dataArray.slice(100,bufferLength).reduce((a,b)=>a+b,0)/(bufferLength-100);

    for(let i = 0; i < bufferLength; i++){
        // Base multiplier based on frequency band
        let multiplier;
        if(i < 20) multiplier = 4 + bass/30;       // Bass
        else if(i < 100) multiplier = 2 + mid/60;  // Mid
        else multiplier = 1 + treble/80;           // Treble/Highs

        const barHeight = dataArray[i] * multiplier;

        // Color dynamically by frequency + amplitude
        const hue = (i*2 + barHeight*0.5) % 360;
        ctx.fillStyle = `hsl(${hue},100%,50%)`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

        x += barWidth + 1;
    }
}

draw();

// Handle window resize
window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
