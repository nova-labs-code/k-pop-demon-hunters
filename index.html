<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Visualizer</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    display: block;
  }
  #startBtn {
    position: absolute;
    padding: 14px 28px;
    font-size: 22px;
    background: #ff0055;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<button id="startBtn">START</button>
<canvas id="visualizer"></canvas>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
let audio, audioCtx, analyser, source;
let logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

let started = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

document.getElementById("startBtn").addEventListener("click", async () => {
  if (started) return;
  started = true;
  document.getElementById("startBtn").style.display = "none";

  audio = new Audio("your-audio.mp3"); // Replace with your file
  audio.crossOrigin = "anonymous";
  audio.loop = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 32768; // Max allowed
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audio.play();

  draw();
});

function draw() {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bufferLength = analyser.frequencyBinCount;
  let dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  const barCount = 15000;
  const angleStep = (Math.PI * 2) / barCount;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const logoRadius = 140; // Logo radius
  const barMax = 220;     // Bar length

  // Smooth wave/rhyme
  const time = Date.now() * 0.002;

  // Draw logo at center
  const logoSize = logoRadius * 2;
  ctx.drawImage(logo, cx - logoRadius, cy - logoRadius, logoSize, logoSize);

  for (let i = 0; i < barCount; i++) {
    const angle = i * angleStep;

    // Frequency mapping
    const freqIndex = Math.floor(i / barCount * bufferLength);
    let value = dataArray[freqIndex] || 0;

    // Rhythmic wave overlay
    const wave = Math.sin(i * 0.01 + time) * 0.3 + 0.7;
    const barLen = (value / 255) * barMax * wave;

    const x1 = cx + Math.cos(angle) * logoRadius;
    const y1 = cy + Math.sin(angle) * logoRadius;
    const x2 = cx + Math.cos(angle) * (logoRadius + barLen);
    const y2 = cy + Math.sin(angle) * (logoRadius + barLen);

    ctx.strokeStyle = `hsl(${(i / barCount) * 360 + time * 40}, 100%, 50%)`;
    ctx.lineWidth = 0.35;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}
</script>
</body>
</html>
