<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Demon Hunters</title>
<link rel="manifest" href="./manifest.json">

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}
canvas { display:block; }

#startText {
  position: fixed;
  inset: 0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
  background: rgba(0,0,0,0.85);
  z-index:9999;
}
</style>
</head>

<body>

<div id="startText">Click to Start</div>

<audio id="player" preload="auto" playsinline></audio>
<canvas id="canvas"></canvas>

<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

/* =========================
   🎧 FULL 50 TRACK NAMES
========================= */

const trackNames = {
  "song1.mp3":"Soda Pop (HUNTR/X Version)",
  "song2.mp3":"How It's Done (Metal Cover)",
  "song3.mp3":"Golden (Acapella)",
  "song4.mp3":"Golden (Instrumental)",
  "song5.mp3":"Golden (Sing-Along)",
  "song6.mp3":"Golden",
  "song7.mp3":"How It's Done (Acapella)",
  "song8.mp3":"How It's Done (Instrumental)",
  "song9.mp3":"How It's Done (Sing-Along)",
  "song10.mp3":"How It's Done",
  "song11.mp3":"Takedown (Acapella)",
  "song12.mp3":"Takedown (Instrumental)",
  "song13.mp3":"Takedown (Sing-Along)",
  "song14.mp3":"Takedown",
  "song15.mp3":"What It Sounds Like (Acapella)",
  "song16.mp3":"What It Sounds Like (Instrumental)",
  "song17.mp3":"What It Sounds Like (Sing-Along)",
  "song18.mp3":"What It Sounds Like",
  "song19.mp3":"Soda Pop (Cover)",
  "song20.mp3":"Jinu's Lament",
  "song21.mp3":"오솔길 Path",
  "song22.mp3":"Soda Pop (Acoustic)",
  "song23.mp3":"Golden Male Version",
  "song24.mp3":"Your Idol Acoustic",
  "song25.mp3":"Hunter's Mantra",
  "song26.mp3":"Score Suite",
  "song27.mp3":"Face Your Demons",
  "song28.mp3":"Your Idol (Huntrix Version)",
  "song29.mp3":"Golden Cover (Rain Paris)",
  "song30.mp3":"Free (Acapella)",
  "song31.mp3":"Free (Instrumental)",
  "song32.mp3":"Free (Sing-Along)",
  "song33.mp3":"Free",
  "song34.mp3":"Soda Pop (Acapella)",
  "song35.mp3":"Soda Pop (Instrumental)",
  "song36.mp3":"Soda Pop (Sing-Along)",
  "song37.mp3":"Soda Pop",
  "song38.mp3":"Your Idol (Acapella)",
  "song39.mp3":"Your Idol (Instrumental)",
  "song40.mp3":"Your Idol (Sing-Along)",
  "song41.mp3":"Your Idol",
  "song42.mp3":"Huntrix - Takedown Cover",
  "song43.mp3":"Takedown Slowed Acoustic",
  "song44.mp3":"What It Sounds Like Acoustic",
  "song45.mp3":"Strategy",
  "song46.mp3":"TAKEDOWN (Alt)",
  "song47.mp3":"Monst3r - Rumi",
  "song48.mp3":"Takedown Saja Boys Version",
  "song49.mp3":"Love, Maybe",
  "song50.mp3":"Golden Acoustic Cover"
};

/* =========================
   PLAYLIST (ALL 50 FILES)
========================= */

const tracks = Array.from({ length: 50 }, (_, i) => ({
  file: `./song${i + 1}.mp3`,
  key: `song${i + 1}.mp3`,
  title: trackNames[`song${i + 1}.mp3`] || `Track ${i + 1}`
}));

let current = 0;
const audio = document.getElementById("player");

/* =========================
   SHUFFLE
========================= */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
shuffle(tracks);

/* =========================
   MEDIA SESSION (LOCK SCREEN)
========================= */

function setMedia(track){

  if(!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: "KPDH",
    album: "50 Track Playlist",
    artwork: [{
      src:"./favicon.ico",
      sizes:"512x512",
      type:"image/png"
    }]
  });

  navigator.mediaSession.setActionHandler("play", ()=>audio.play());
  navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", ()=>play(current+1));
  navigator.mediaSession.setActionHandler("previoustrack", ()=>play(current-1));
}

/* =========================
   WEB AUDIO (VISUALIZER ONLY)
========================= */

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 4096;

const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
const smoothArray = new Float32Array(bufferLength);

/* =========================
   BACKGROUND SAFE MODE
========================= */

let active = true;

document.addEventListener("visibilitychange", () => {
  active = !document.hidden;
  if(document.hidden){
    audioCtx.suspend().catch(()=>{});
  } else {
    audioCtx.resume().catch(()=>{});
  }
});

/* =========================
   PLAY ENGINE
========================= */

function play(i){

  if(i < 0) i = tracks.length - 1;
  if(i >= tracks.length) i = 0;

  current = i;

  const track = tracks[current];

  audio.src = track.file;
  audio.currentTime = 0;

  audio.play().catch(()=>{});

  setMedia(track);
}

/* =========================
   AUTO NEXT
========================= */

audio.addEventListener("ended", ()=>play(current+1));

/* =========================
   START
========================= */

document.getElementById("startText").addEventListener("click", async ()=>{

  await audioCtx.resume();

  document.getElementById("startText").style.display = "none";

  play(0);
});

/* =========================
   VISUALIZER (SAFE BACKGROUND)
========================= */

function draw(){

  requestAnimationFrame(draw);

  if(!active) return;

  analyser.getByteFrequencyData(dataArray);

  for(let i=0;i<bufferLength;i++){
    smoothArray[i] = smoothArray[i]*0.8 + dataArray[i]*0.2;
  }

  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let bass = 0;
  for(let i=0;i<50;i++) bass += smoothArray[i];
  bass /= 50;

  const cx = canvas.width/2;
  const cy = canvas.height/2;
  const base = Math.min(canvas.width,canvas.height)*0.12;

  const radius = base + (bass/255)*base*0.6;

  const time = Date.now()*0.02;

  for(let i=0;i<2000;i++){

    const angle = (i/2000)*Math.PI*2;
    const idx = Math.floor((i/2000)*400);

    const spike = (smoothArray[idx]/255)*120;

    const x1 = cx + Math.cos(angle)*radius;
    const y1 = cy + Math.sin(angle)*radius;

    const x2 = cx + Math.cos(angle)*(radius+spike);
    const y2 = cy + Math.sin(angle)*(radius+spike);

    ctx.strokeStyle = `hsl(${(i*360/2000 + time)%360},100%,55%)`;
    ctx.lineWidth = 0.35;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
}

draw();

</script>
</body>
</html>
