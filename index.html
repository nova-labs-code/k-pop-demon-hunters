<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Epic Circular Visualizer</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}
canvas { display:block; }
#startText {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
  background:rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = 1920;
canvas.height = 1080;

const startText = document.getElementById("startText");
const audio = document.getElementById("player");
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 4096;
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// --- Track list (song1 → song50) ---
const maxTracks = 50;
let tracks = [];
for(let i=1;i<=maxTracks;i++){
    tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
}
let currentTrack = 0;
function playNextTrack(){
    if(tracks.length===0) return;
    if(currentTrack >= tracks.length) currentTrack = 0;
    audio.src = tracks[currentTrack];
    audio.play().catch(err => console.log("Play error:", err));
    currentTrack++;
}

// --- Click to start ---
startText.addEventListener("click", ()=>{
    audioCtx.resume().then(()=>{
        startText.style.display = "none";
        document.body.style.cursor = "none";
        playNextTrack();
    });
});
audio.addEventListener("ended", playNextTrack);

// --- Assets ---
const logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";
const bg = new Image();
bg.src = "https://bvp.neocities.org/sagaboys%20huntrix.png";

// --- Camera shake ---
let shakeX = 0, shakeY = 0;

// --- Visualizer ---
function draw(){
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    // Bass detection
    const bass = dataArray.slice(0, 60).reduce((a,b)=>a+b,0)/60;
    shakeX = (Math.random() - 0.5) * bass * 0.4;
    shakeY = (Math.random() - 0.5) * bass * 0.4;

    // Background with shake
    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.drawImage(bg, 0, 0, 1920, 1080);
    ctx.restore();

    const centerX = canvas.width / 2 + shakeX;
    const centerY = canvas.height / 2 + shakeY;
    const radius = Math.min(centerX, centerY) / 2.5;

    const bars = 300;
    const step = Math.floor(bufferLength / bars);

    for(let i = 0; i < bars; i++){
        const value = dataArray[i*step];
        const angle = (i / bars) * Math.PI * 2;
        const barLength = value * 1.3;

        const x1 = centerX + Math.cos(angle) * radius;
        const y1 = centerY + Math.sin(angle) * radius;
        const x2 = centerX + Math.cos(angle) * (radius + barLength);
        const y2 = centerY + Math.sin(angle) * (radius + barLength);

        const hue = (i*1.2 + value*0.6) % 360;
        ctx.strokeStyle = `hsl(${hue},100%,50%)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    // Pulse circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius * 0.55 + bass/4, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,0.07)`;
    ctx.fill();

    // Logo
    if(logo.complete){
        const size = radius * 0.9;
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, size/2, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(logo, centerX - size/2, centerY - size/2, size, size);
        ctx.restore();
    }
}

draw();
</script>

</body>
</html>
