<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rhythmic Circle Visualizer</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
    }
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 22px;
      background: #111;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Visualizer</button>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const startBtn = document.getElementById("startBtn");

    let audio, analyser, source, dataArray;
    let logo = new Image();
    logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    startBtn.addEventListener("click", async () => {
      document.body.style.cursor = "none";
      startBtn.style.display = "none";

      // Load your audio
      audio = new Audio("song1.mp3"); // change to your audio source
      audio.loop = true;
      audio.crossOrigin = "anonymous";

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32768; // max allowed
      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      await audio.play();
      draw();
    });

    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      analyser.getByteFrequencyData(dataArray);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      const barCount = 15000;
      const angleStep = (Math.PI * 2) / barCount;

      const logoRadius = Math.min(canvas.width, canvas.height) * 0.15;
      const maxBarLen = Math.min(canvas.width, canvas.height) * 0.25;

      // Draw logo in center
      const logoSize = logoRadius * 2;
      ctx.drawImage(logo, cx - logoRadius, cy - logoRadius, logoSize, logoSize);

      const time = Date.now() * 0.002;

      for (let i = 0; i < barCount; i++) {
        const angle = i * angleStep;

        // Map bar to a smoothed frequency value
        const freqIndex = Math.floor(i / barCount * dataArray.length);
        const neighbors = 6;
        let sum = 0;
        for (let n = -neighbors; n <= neighbors; n++) {
          sum += dataArray[Math.min(dataArray.length - 1, Math.max(0, freqIndex + n))];
        }
        let value = sum / (neighbors * 2 + 1);

        // Wave rhythm overlay
        const rhythm = Math.sin(angle * 8 + time) * 0.5 + 0.5;

        // Bass emphasis (lower freqs drive more)
        const weight = 1 + (freqIndex / dataArray.length) * 1.8;

        const barLen = (value / 255) * maxBarLen * rhythm * weight;

        const x1 = cx + Math.cos(angle) * logoRadius;
        const y1 = cy + Math.sin(angle) * logoRadius;
        const x2 = cx + Math.cos(angle) * (logoRadius + barLen);
        const y2 = cy + Math.sin(angle) * (logoRadius + barLen);

        ctx.strokeStyle = `hsl(${(i / barCount) * 360 + time * 40}, 100%, 50%)`;
        ctx.lineWidth = 0.25;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
  </script>
</body>
</html>
