<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube-Style Visualizer with Logo Pulse</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:black; cursor:pointer; }
canvas { display:block; }
#startText {
  position: fixed; top:0; left:0; right:0; bottom:0;
  display:flex; justify-content:center; align-items:center;
  color:white; font-size:48px; font-family:sans-serif;
  user-select:none; background: rgba(0,0,0,0.85); z-index:9999;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('player');
const startText = document.getElementById('startText');

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let centerX = canvas.width/2, centerY = canvas.height/2;
let logoBaseRadius = Math.min(canvas.width,canvas.height)*0.12;
let logoRadius = logoBaseRadius;
window.addEventListener('resize', ()=>{
    centerX = canvas.width/2;
    centerY = canvas.height/2;
    logoBaseRadius = Math.min(canvas.width,canvas.height)*0.12;
    logoRadius = logoBaseRadius;
});

// Playlist
const maxTracks = 50;
let tracks = [];
for(let i=1;i<=maxTracks;i++) tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
shuffle(tracks);

let currentTrack = 0;
function playTrack(index){
    if(tracks.length===0) return;
    if(index<0) index = tracks.length-1;
    if(index>=tracks.length) index = 0;
    currentTrack = index;
    audio.src = tracks[currentTrack];
    audio.play().catch(e=>console.log("Play error:", e));
}
audio.addEventListener("ended", ()=>playTrack(currentTrack+1));
function shuffle(array){ for(let i=array.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [array[i],array[j]]=[array[j],array[i]]; } }

// Media keys
if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('previoustrack', ()=>playTrack(currentTrack-1));
    navigator.mediaSession.setActionHandler('nexttrack', ()=>playTrack(currentTrack+1));
    navigator.mediaSession.setActionHandler('play', ()=>audio.play());
    navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
}

// Web Audio
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 32768;
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
const smoothArray = new Float32Array(bufferLength);

// Logo
const logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

// Start
startText.addEventListener("click", ()=>{
    audioCtx.resume().then(()=>{
        startText.style.display="none";
        document.body.style.cursor="none";
        playTrack(currentTrack);
    });
});

// Draw
function draw(){
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    // Smooth
    for(let i=0;i<bufferLength;i++){
        smoothArray[i] = smoothArray[i]*0.8 + dataArray[i]*0.2;
    }

    // Calculate bass for logo pulse (0-200Hz)
    let bassSum = 0;
    for(let i=0;i<Math.floor(200*bufferLength/22050);i++){
        bassSum += smoothArray[i];
    }
    let bassAvg = bassSum / Math.max(1, Math.floor(200*bufferLength/22050));
    logoRadius = logoBaseRadius + bassAvg*0.2; // pulse factor

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const actualBars = 25000; // computed bars
    const layers = 2; // simulate 50k
    const hueShift = Date.now()*0.02;

    for(let l=0;l<layers;l++){
        for(let i=0;i<actualBars;i++){
            const logIndex = Math.floor(Math.pow(i/actualBars,0.5)*bufferLength);
            const value = smoothArray[logIndex] || 0;
            const spike = Math.pow(value/255,2) * Math.min(canvas.width,canvas.height)*0.125;

            let baseAngle = (i/actualBars)*Math.PI*2;
            const waveOffset = Math.sin(Date.now()*0.002+i*0.005 + l*0.01)*0.05;
            const angle = baseAngle + waveOffset;
            const barLength = Math.max(2,spike);

            const x1 = centerX + Math.cos(angle)*logoRadius;
            const y1 = centerY + Math.sin(angle)*logoRadius;
            const x2 = centerX + Math.cos(angle)*(logoRadius+barLength);
            const y2 = centerY + Math.sin(angle)*(logoRadius+barLength);

            const hue = (i*360/actualBars+hueShift + l*10)%360;
            ctx.strokeStyle = `hsl(${hue},100%,50%)`;
            ctx.lineWidth = 0.3;
            ctx.beginPath();
            ctx.moveTo(x1,y1);
            ctx.lineTo(x2,y2);
            ctx.stroke();
        }
    }

    // Draw logo
    if(logo.complete){
        const size = logoRadius*2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX,centerY,logoRadius,0,Math.PI*2);
        ctx.clip();
        ctx.drawImage(logo,centerX-logoRadius,centerY-logoRadius,size,size);
        ctx.restore();
    }
}

draw();
</script>
</body>
</html>
