<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Demon Hunters</title>
<link rel="manifest" href="/manifest.json">
<style>
html, body { margin:0; padding:0; overflow:hidden; background:black; cursor:pointer; }
canvas { display:block; }
#startText {
  position: fixed; top:0; left:0; right:0; bottom:0;
  display:flex; justify-content:center; align-items:center;
  color:white; font-size:48px; font-family:sans-serif;
  user-select:none; background: rgba(0,0,0,0.85); z-index:9999;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas"></canvas>

<script>
// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Auto-numbered playlist 1-50
let tracks = [];
for (let i = 1; i <= 50; i++) {
    tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
}

// Mapping to real song names
const trackNames = {
  "song1.mp3":"Soda Pop (HUNTR/X Version)",
  "song2.mp3":"How It's Done (KPOP DEMON HUNTERS METAL COVER)",
  "song3.mp3":"Golden (Acapella)",
  "song4.mp3":"Golden (Instrumental)",
  "song5.mp3":"Golden (Sing-Along)",
  "song6.mp3":"Golden",
  "song7.mp3":"How It's Done (Acapella)",
  "song8.mp3":"How It's Done (Instrumental)",
  "song9.mp3":"How It's Done (Sing-Along)",
  "song10.mp3":"How It's Done",
  "song11.mp3":"Takedown (Acapella)",
  "song12.3":"Takedown (Instrumental)",
  "song13.mp3":"Takedown (Sing-Along)",
  "song14.mp3":"Takedown",
  "song15.mp3":"What It Sounds Like (Acapella)",
  "song16.mp3":"What It Sounds Like (Instrumental)",
  "song17.mp3":"What It Sounds Like (Sing-Along)",
  "song18.mp3":"What It Sounds Like",
  "song19.mp3":"Soda Pop (Cover)",
  "song20.mp3":"Jinu's Lament",
  "song21.mp3":"오솔길 Path",
  "song22.mp3":"Soda Pop (Feat Kim X & ZEVON) (Acoustic Version)",
  "song23.mp3":"Male Version HUNTRIX - Golden (Kpop Demon Hunters)",
  "song24.mp3":"Your Idol - KPop Demon Hunters - Acoustic Cover",
  "song25.mp3":"Prolouge (Hunter's Mantra)",
  "song26.mp3":"Score Suite",
  "song27.mp3":"Face Your Demons (Rumi Villain Song)",
  "song28.mp3":"Your Idol (Huntrix Version)",
  "song29.mp3":"Golden Cover (Rain Paris)",
  "song30.mp3":"Free (Acapella)",
  "song31.mp3":"Free (Instrumental)",
  "song32.mp3":"Free (Sing-Along)",
  "song33.mp3":"Free",
  "song34.mp3":"Soda Pop (Acapella)",
  "song35.mp3":"Soda Pop (Instrumental)",
  "song36.mp3":"Soda Pop (Sing-Along)",
  "song37.mp3":"Soda Pop",
  "song38.mp3":"Your Idol (Acapella)",
  "song39.mp3":"Your Idol (Instrumental)",
  "song40.mp3":"Your Idol (Sing-Along)",
  "song41.mp3":"Your Idol",
  "song42.mp3":"Huntrix - Takedown (Singing Cover)",
  "song43.mp3":"KPop Demon Hunters - TAKEDOWN (Slowed Acoustic Lyrics)",
  "song44.mp3":"What it sounds like (acoustic)",
  "song45.mp3":"Strategy",
  "song46.mp3":"TAKEDOWN",
  "song47.mp3":"Monst3r - Rumi (K-Pop Demon Hunters)",
  "song48.mp3":"Takedown - Saja Boys (Demon Boy Cut)",
  "song49.mp3":"사랑인가 봐 Love, Maybe",
  "song50.mp3":"Golden (Acoustic Cover)"
};

// Shuffle playlist
function shuffle(array){ for(let i=array.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [array[i],array[j]]=[array[j],array[i]]; } }
shuffle(tracks);

let currentTrack = 0;
const audio = document.getElementById('player');

// Update tab title
function updateTabTitle(url){
    const name = trackNames[url.split('/').pop()] || "Unknown Song";
    document.title = `KPDH - ${name}`;
}

// Media Session API for your app
function updateMediaSession(url){
    const name = trackNames[url.split('/').pop()] || "Unknown Song";
    if('mediaSession' in navigator){
        navigator.mediaSession.metadata = new MediaMetadata({
            title: name,
            artist: 'Netflix', // Sets the artist name for the track to "Netflix"
            album: 'KPDH Playlist',      // Sets the album name for the track
            artwork: [
                { src: './favicon.ico', sizes: '512x512', type: 'image/ico' }
            ]
        });
        navigator.mediaSession.setActionHandler('previoustrack', ()=>playTrack(currentTrack-1));
        navigator.mediaSession.setActionHandler('nexttrack', ()=>playTrack(currentTrack+1));
        navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
        navigator.mediaSession.setActionHandler('play', ()=>audio.play());
    }
}

// Play track function
function playTrack(index){
    if(tracks.length===0) return;
    if(index<0) index = tracks.length-1;
    if(index>=tracks.length) index = 0;
    currentTrack = index;
    audio.src = tracks[currentTrack];
    updateTabTitle(tracks[currentTrack]);
    updateMediaSession(tracks[currentTrack]);
    audio.play().catch(e=>console.log("Play error:", e));
}

// Auto-next
audio.addEventListener("ended", ()=>playTrack(currentTrack+1));

// Web Audio API
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 32768;
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
const smoothArray = new Float32Array(bufferLength);

// Logo
const logo = new Image();
logo.src = "https://samsongraceacademy.neocities.org/favicon.png";

// Start click
const startText = document.getElementById('startText');
startText.addEventListener("click", ()=>{
    audioCtx.resume().then(()=>{
        startText.style.display="none";
        document.body.style.cursor="none";
        playTrack(currentTrack);
    });
});

// Keyboard & Media Keys
window.addEventListener('keydown', e=>{
    if(e.code==="MediaTrackNext") playTrack(currentTrack+1);
    if(e.code==="MediaTrackPrevious") playTrack(currentTrack-1);
    if(e.code==="Space") audio.paused ? audio.play() : audio.pause();
});

// Visualizer
const actualBars = 15000;
const maxFreq = 1200;

function draw(){
    requestAnimationFrame(draw);

    const centerX = canvas.width/2;
    const centerY = canvas.height/2;
    const logoBaseRadius = Math.min(canvas.width,canvas.height)*0.12;
    let logoRadius;

    analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<bufferLength;i++){
        smoothArray[i] = smoothArray[i]*0.7 + dataArray[i]*0.3;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let bassSum = 0;
    const bassLimit = 60;
    for(let i=0;i<bassLimit;i++) bassSum += smoothArray[i];
    const bassAvg = bassSum / bassLimit;

    const minLogo = logoBaseRadius;
    const maxLogo = logoBaseRadius*1.5;
    logoRadius = minLogo + (bassAvg/255)*(maxLogo-minLogo);

    const hueShift = Date.now()*0.02;

    for(let i=0;i<actualBars;i++){
        const angle = (i/actualBars)*Math.PI*2;
        const freqIndex = Math.floor((i/actualBars)*maxFreq);
        const spike = (smoothArray[freqIndex]/255)*Math.min(canvas.width,canvas.height)*0.18 + bassAvg*0.15;

        const x1 = centerX + Math.cos(angle)*logoRadius;
        const y1 = centerY + Math.sin(angle)*logoRadius;
        const x2 = centerX + Math.cos(angle)*(logoRadius+spike);
        const y2 = centerY + Math.sin(angle)*(logoRadius+spike);

        const hue = (i*360/actualBars + hueShift)%360;
        ctx.strokeStyle = `hsl(${hue},100%,50%)`;
        ctx.lineWidth = 0.35;
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    if(logo.complete){
        const size = logoRadius*2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX,centerY,logoRadius,0,Math.PI*2);
        ctx.clip();
        ctx.drawImage(logo,centerX-logoRadius,centerY-logoRadius,size,size);
        ctx.restore();
    }
}

draw();
</script>
</body>
</html>
