<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythmic Circle Visualizer</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; }
  #startBtn {
    position: absolute;
    padding: 14px 28px;
    font-size: 22px;
    background: #ff0055;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<button id="startBtn">START</button>
<canvas id="visualizer"></canvas>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
let audio, audioCtx, analyser, source;
let logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

let started = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

document.getElementById("startBtn").addEventListener("click", async () => {
  if (started) return;
  started = true;
  document.getElementById("startBtn").style.display = "none";

  audio = new Audio("your-audio.mp3"); // replace with your song
  audio.crossOrigin = "anonymous";
  audio.loop = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 16384;
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audio.play();

  draw();
});

// --- smoothing buffer ---
function smoothArray(data, smoothing = 5) {
  let smoothed = new Float32Array(data.length);
  for (let i = 0; i < data.length; i++) {
    let sum = 0, count = 0;
    for (let j = -smoothing; j <= smoothing; j++) {
      if (i + j >= 0 && i + j < data.length) {
        sum += data[i + j];
        count++;
      }
    }
    smoothed[i] = sum / count;
  }
  return smoothed;
}

function draw() {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bufferLength = analyser.frequencyBinCount;
  let dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  // smooth data for rhythm
  dataArray = smoothArray(dataArray, 4);

  const barCount = 15000;
  const angleStep = (Math.PI * 2) / barCount;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const logoRadius = 140;
  const barMax = 250;

  // Draw logo
  const logoSize = logoRadius * 2;
  ctx.drawImage(logo, cx - logoRadius, cy - logoRadius, logoSize, logoSize);

  const time = Date.now() * 0.003; // rhythm timer

  for (let i = 0; i < barCount; i++) {
    const angle = i * angleStep;

    // map frequency index
    const freqIndex = Math.floor(i / barCount * bufferLength);
    let value = dataArray[freqIndex] || 0;

    // rhythmic pulse overlay (smooth sine wave)
    const rhythm = (Math.sin(time + i * 0.005) + 1) / 2; // 0–1
    const barLen = (value / 255) * barMax * (0.5 + rhythm * 0.8);

    const x1 = cx + Math.cos(angle) * logoRadius;
    const y1 = cy + Math.sin(angle) * logoRadius;
    const x2 = cx + Math.cos(angle) * (logoRadius + barLen);
    const y2 = cy + Math.sin(angle) * (logoRadius + barLen);

    ctx.strokeStyle = `hsl(${(i / barCount) * 360 + time * 40}, 100%, 50%)`;
    ctx.lineWidth = 0.3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}
</script>
</body>
</html>
