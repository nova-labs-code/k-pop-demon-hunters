<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3000-Bar Music Visualizer</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}
canvas { display:block; }
#startText {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
  background:rgba(0,0,0,0.85);
}
</style>
</head>
<body>
<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas" width="1920" height="1080"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = 1920;
canvas.height = 1080;

const startText = document.getElementById("startText");
const audio = document.getElementById("player");

// audio context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 16384;
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// playlist (shuffle applied)
const maxTracks = 50;
let tracks = [];
for(let i=1;i<=maxTracks;i++){
  tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
}
shuffle(tracks);

let currentTrack = 0;
function playNextTrack(){
  if(tracks.length===0) return;
  if(currentTrack >= tracks.length) currentTrack = 0;
  audio.src = tracks[currentTrack];
  audio.play().catch(err => console.log("Play error:", err));
  currentTrack++;
}
audio.addEventListener("ended", playNextTrack);

// Fisher–Yates shuffle
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// start on click
startText.addEventListener("click", ()=>{
  audioCtx.resume().then(()=>{
    startText.style.display = "none";
    document.body.style.cursor = "none";
    playNextTrack();
  });
});

// logo image
const logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

// draw loop
function draw(){
  requestAnimationFrame(draw);
  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const centerX = canvas.width/2;
  const centerY = canvas.height/2;
  const radius = 280;

  const bars = 3000;
  const step = Math.floor(bufferLength / bars);
  let hueShift = Date.now() * 0.02;

  for(let i=0;i<bars;i++){
    const value = dataArray[i*step] || 0;
    const angle = (i / bars) * Math.PI * 2;
    const barLength = Math.max(10, value * 0.8);

    const x1 = centerX + Math.cos(angle) * radius;
    const y1 = centerY + Math.sin(angle) * radius;
    const x2 = centerX + Math.cos(angle) * (radius + barLength);
    const y2 = centerY + Math.sin(angle) * (radius + barLength);

    const hue = (i * 360 / bars + hueShift) % 360;
    ctx.strokeStyle = `hsl(${hue},100%,50%)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  // logo in center
  if(logo.complete){
    const size = radius * 1.1;
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, size/2, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(logo, centerX - size/2, centerY - size/2, size, size);
    ctx.restore();
  }
}

draw();
</script>
</body>
</html>
