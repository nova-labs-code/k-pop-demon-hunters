<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circular Beat Visualizer</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  cursor:pointer;
}
canvas { display:block; }
#startText {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:48px;
  font-family:sans-serif;
  user-select:none;
  background:rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div id="startText">Click to Start</div>
<audio id="player" type="audio/mpeg"></audio>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const startText = document.getElementById("startText");
const audio = document.getElementById("player");
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048;
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

// --- Tracks sequentially from song1 to song50 ---
const maxTracks = 50;
let tracks = [];
for(let i=1;i<=maxTracks;i++){
    tracks.push(`https://dev-bvp.github.io/k-pop-demon-hunters/song${i}.mp3`);
}
let currentTrack = 0;

function playNextTrack(){
    if(tracks.length===0) return;
    if(currentTrack >= tracks.length) currentTrack = 0;
    audio.src = tracks[currentTrack];
    audio.play().catch(err => console.log("Play error:", err));
    currentTrack++;
}

// --- Click to start ---
startText.addEventListener("click", ()=>{
    audioCtx.resume().then(()=>{
        startText.style.display = "none";
        document.body.style.cursor = "none"; // hide cursor
        playNextTrack();
    });
});
audio.addEventListener("ended", playNextTrack);

// --- Load central logo ---
const logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

// --- Circular visualizer ---
function draw(){
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) / 3;

    const bars = 180;
    const step = Math.floor(bufferLength / bars);

    for(let i = 0; i < bars; i++){
        const value = dataArray[i*step];
        const angle = (i / bars) * Math.PI * 2;
        const barLength = value * 1.2;

        const x1 = centerX + Math.cos(angle) * radius;
        const y1 = centerY + Math.sin(angle) * radius;
        const x2 = centerX + Math.cos(angle) * (radius + barLength);
        const y2 = centerY + Math.sin(angle) * (radius + barLength);

        const hue = (i*2 + value*0.5) % 360;
        ctx.strokeStyle = `hsl(${hue},100%,50%)`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    // Bass circle pulse
    const bass = dataArray.slice(0,40).reduce((a,b)=>a+b,0)/40;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius * 0.6 + bass/5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,0.05)`;
    ctx.fill();

    // Draw logo in center
    if(logo.complete){
        const size = radius * 0.9;
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, size/2, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(logo, centerX - size/2, centerY - size/2, size, size);
        ctx.restore();
    }
}

draw();

window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
