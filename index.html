<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>8K Circle Visualizer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }
  canvas { display: block; }
  #startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 40px;
    font-size: 24px;
    background: #fff;
    color: #000;
    border: none;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<button id="startBtn">Start</button>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;
let centerX = width/2;
let centerY = height/2;
let logoRadius = Math.min(width,height)*0.15;

window.addEventListener("resize", () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  centerX = width/2;
  centerY = height/2;
  logoRadius = Math.min(width,height)*0.15;
});

// Logo
const logo = new Image();
logo.src = "https://bvp.neocities.org/roblox%20pfp.png";

// Auto-detect MP3s (assumes server files: song1.mp3 -> song50.mp3)
const audioFiles = [];
for(let i=1;i<=50;i++){
  audioFiles.push(`k-pop-demon-hunters/song${i}.mp3`);
}
const shuffled = audioFiles.sort(()=>Math.random()-0.5);
let currentTrack = 0;

const audio = new Audio();
audio.crossOrigin = "anonymous";

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
const source = audioCtx.createMediaElementSource(audio);
const analyser = audioCtx.createAnalyser();
source.connect(analyser);
analyser.connect(audioCtx.destination);

// FFT size capped to max safe
analyser.fftSize = 16384;
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

const bars = 8000;
const angleStep = (Math.PI*2)/bars;

function playTrack(index){
  currentTrack = index % shuffled.length;
  audio.src = shuffled[currentTrack];
  audio.play();
}

audio.addEventListener("ended", ()=>playTrack(currentTrack+1));

function draw(){
  requestAnimationFrame(draw);
  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,width,height);

  // draw logo
  const logoSize = logoRadius*2;
  ctx.drawImage(logo, centerX-logoRadius, centerY-logoRadius, logoSize, logoSize);

  // draw bars
  for(let i=0;i<bars;i++){
    // map bar to existing frequency bin
    const bin = Math.floor(i / bars * bufferLength);
    const value = dataArray[bin];
    const barHeight = value*0.5;

    const angle = i*angleStep;
    const x1 = centerX + Math.cos(angle)*logoRadius;
    const y1 = centerY + Math.sin(angle)*logoRadius;
    const x2 = centerX + Math.cos(angle)*(logoRadius+barHeight);
    const y2 = centerY + Math.sin(angle)*(logoRadius+barHeight);

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = `hsl(${i/bars*360},100%,50%)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// Start button
document.getElementById("startBtn").addEventListener("click", async ()=>{
  await audioCtx.resume();
  document.getElementById("startBtn").style.display="none";
  document.body.style.cursor="none";
  playTrack(0);
  draw();
});
</script>
</body>
</html>
